# One-off: store the 87 House roll calls on our bills that the sync skipped.
#
# 85 are "On Agreeing to the Amendment" (2 "Previous Question"). Congress.gov's
# House vote list names the amendment rather than the bill for these, so the
# sync's bill lookup found nothing. The sync now takes the bill from the House
# Clerk's <legis-num>. This re-sends exactly those roll numbers; upserts are
# idempotent. Runs once on push (after the new build deploys); delete after.
name: Restore House amendment votes (one-off)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-amendment-votes.yml']
  workflow_dispatch:

concurrency:
  group: restore-amendment-votes
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the legis-num build to be live
        run: sleep 240
      - name: POST /api/sync-congress-votes with the skipped roll numbers
        run: |
          call() { # session "comma,separated,rolls"
            body=$(printf '{"chamber":"house","congress":119,"session":%s,"maxVotes":60,"rolls":[%s]}' "$1" "$2")
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 310 --retry 2 --retry-delay 15 \
              -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" \
              -d "$body" "https://www.democracyunlocked.com/api/sync-congress-votes")
            echo "house s$1 → HTTP $code"
            python3 -c "import json;d=json.load(open('/tmp/body'));print('  synced',d.get('synced'),'matched',d.get('rollCallsMatched'),'errors',d.get('errors'))" 2>/dev/null || cat /tmp/body
          }
          call 1 "79,80,81,82,150,180,187,188,204,205,206,207,208,209,210,227,228,229,230,231,232,233,234,235,236,237,244,245,246,247,248,249,250,251,252,253,254,255,256,257,258,259,260,325,326,327"
          call 2 "26,27,40,43,44,122,123,144,145,146,147,148,149,150,151,152,174,241,242,243,244,245,255,256,257,258,259,260,261,262,263,264,265,266,267,268,269,273,274,275,276"
