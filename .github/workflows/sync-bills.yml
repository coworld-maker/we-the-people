name: Daily Data Sync

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
    inputs:
      lobbying_offset:
        description: 'Resume the lobbying backlog from this offset (0 = start over)'
        required: false
        default: '0'

# Cancel any in-progress run when a new one is triggered. Prevents
# back-to-back manual catch-up clicks from piling up identical work.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Each sync target is its own parallel job. Previously the
  # /api/cron/sync orchestrator called all four sequentially, which
  # exceeded Vercel's 300s serverless ceiling and returned 504.
  # Splitting them gives each its own budget AND lets all four run
  # at once. Each curl --max-time 480 covers Vercel's max+buffer.
  #
  # Note on `session`: the 119th Congress has two sessions:
  #   Session 1: Jan 3, 2025 → Jan 3, 2026
  #   Session 2: Jan 3, 2026 → Jan 3, 2027 (current)
  # We sync both each run so the workflow stays correct across the
  # session boundary without code changes. Session-2 fires first
  # because it's where the freshest votes live.
  # ─────────────────────────────────────────────────────────────

  sync-bills:
    name: Sync recent bills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-bills
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"congress": 119, "limit": 50, "offset": 0}' \
            "https://www.democracyunlocked.com/api/sync-bills")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-representatives:
    name: Refresh representatives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-representatives
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://www.democracyunlocked.com/api/sync-representatives")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-house-votes-s2:
    name: Sync House roll-calls (current session)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-congress-votes (house, session 2)
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"congress": 119, "session": 2, "chamber": "house", "maxVotes": 10}' \
            "https://www.democracyunlocked.com/api/sync-congress-votes")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-house-votes-s1:
    name: Sync House roll-calls (prior session)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-congress-votes (house, session 1)
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"congress": 119, "session": 1, "chamber": "house", "maxVotes": 10}' \
            "https://www.democracyunlocked.com/api/sync-congress-votes")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-senate-votes-s2:
    name: Sync Senate roll-calls (current session)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-congress-votes (senate, session 2)
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"congress": 119, "session": 2, "chamber": "senate", "maxVotes": 10}' \
            "https://www.democracyunlocked.com/api/sync-congress-votes")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-senate-votes-s1:
    name: Sync Senate roll-calls (prior session)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-congress-votes (senate, session 1)
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"congress": 119, "session": 1, "chamber": "senate", "maxVotes": 10}' \
            "https://www.democracyunlocked.com/api/sync-congress-votes")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-news:
    name: Sync press coverage (RSS + Newsdata backup)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-news
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://www.democracyunlocked.com/api/sync-news")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-fec-ids:
    name: Sync FEC candidate IDs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-fec-ids
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://www.democracyunlocked.com/api/sync-fec-ids")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  sync-committees:
    name: Sync committee assignments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/sync-committees
        run: |
          response=$(curl -s -o /tmp/body -w "%{http_code}" \
            --max-time 480 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://www.democracyunlocked.com/api/sync-committees")
          echo "Response code: $response"
          cat /tmp/body 2>/dev/null
          echo
          [ "$response" = "200" ] || exit 1

  # Refresh LDA lobbying firm counts. Runs on the server so it uses LDA_API_KEY
  # (120 req/min) instead of the ~15 req/min anonymous limit, and pages through
  # the backlog with the route's offset cursor. Bounded per run — the full set
  # is thousands of bills at two API calls each, so this walks it over nights.
  sync-lobbying:
    name: Sync lobbying firm counts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Loop POST /api/sync-lobbying with cursor
        run: |
          offset=${{ github.event.inputs.lobbying_offset || 0 }}
          for i in $(seq 1 5); do
            response=$(curl -s -o /tmp/body -w "%{http_code}" \
              --max-time 300 --retry 2 --retry-delay 10 --retry-all-errors \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"offset\": $offset, \"limit\": 60}" \
              "https://www.democracyunlocked.com/api/sync-lobbying")
            echo "Iteration $i (offset $offset) — HTTP $response"
            cat /tmp/body 2>/dev/null; echo
            # Best-effort: a slow LDA run can time out an iteration; stop rather
            # than fail the nightly workflow.
            [ "$response" = "200" ] || { echo "Non-200 — stopping early"; break; }
            next=$(python3 -c "import json;d=json.load(open('/tmp/body'));print(d.get('nextOffset') or '')" 2>/dev/null || echo "")
            [ -z "$next" ] && { echo "Backlog complete."; break; }
            offset=$next
          done
          echo "Next offset to resume from: $offset"

  # Pre-warm AI analysis for the most prominent un-analyzed bills so visitors
  # land on a ready summary instead of waiting for the on-view auto-fire. Each
  # call analyzes a small batch (one Claude call each, ~10-20s) under a wall-
  # clock budget; we loop until the night's backlog drains or we hit a cap.
  prewarm-summaries:
    name: Pre-warm AI bill summaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Loop POST /api/sync-summaries until drained (cap ~60 bills)
        run: |
          total=0
          for i in $(seq 1 15); do
            response=$(curl -s -o /tmp/body -w "%{http_code}" \
              --max-time 70 --retry 2 --retry-delay 10 --retry-all-errors \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d '{"limit": 4}' \
              "https://www.democracyunlocked.com/api/sync-summaries")
            echo "Iteration $i — HTTP $response"
            cat /tmp/body 2>/dev/null; echo
            # Pre-warm is best-effort: a slow Claude call can 504 one iteration.
            # Stop this run and let tomorrow's cron continue — don't fail the job.
            [ "$response" = "200" ] || { echo "Non-200 — stopping early (pre-warmed $total so far)"; break; }
            processed=$(python3 -c "import json,sys; print(json.load(open('/tmp/body')).get('processed',0))" 2>/dev/null || echo 0)
            total=$((total + processed))
            # Stop once a batch finds nothing left to analyze.
            [ "$processed" = "0" ] && break
          done
          echo "Pre-warmed $total summaries this run."
